<!doctype html>
<html lang="en">

  <title>Player Profiles · Senior Citizens Scrabble Tournament 2026</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<body>
  <a class="skip-link" href="#main">Skip to player list</a>
  <header class="compact-header">
