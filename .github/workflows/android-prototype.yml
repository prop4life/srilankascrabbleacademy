name: Build SLSA Android prototype

on:
  push:
    branches: [android-prototype]
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-prototype
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slsa-android-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
