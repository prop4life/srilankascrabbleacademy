name: Publish prepared SLSA Android and privacy files

on:
  push:
    branches: [android-prototype]
    paths:
      - '.github/workflows/android-prototype.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android-prototype
          fetch-depth: 1

