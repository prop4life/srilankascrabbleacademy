      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK and release bundle
        working-directory: android-prototype
        run: gradle :app:assembleDebug :app:bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slsa-android-builds
          if-no-files-found: error
          path: |
            android-prototype/app/build/outputs/apk/debug/app-debug.apk
            android-prototype/app/build/outputs/bundle/release/app-release.aab
